<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Learning Simulations</title>
<link rel="stylesheet" href="assets/hub.css?v=22">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16325c">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
</head>
<body>
<main><p class="note">Opening the simulations for this course… <a href="index.html">Go to the hub</a></p></main>
<script type="module">
// Course pages now live on the area page as a course filter. Old links (e.g. posted in Classroom) still work.
import {loadCatalog, qs} from './assets/hub.js?v=22';
const cat = await loadCatalog();
const c = cat.courses.find(x => x.id === qs('id'));
location.replace(c ? `area.html?id=${c.areaId}&course=${c.id}` : 'index.html');
</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});</script>
</body>
</html>
